set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-a

# use an interactive login zsh in tmux sessions
set -g default-shell "$SHELL"
set -g default-command "$SHELL -l"

# allow terminal to handle mouse events (for clicking links)
set -g terminal-features '*:hyperlinks'

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# use shift+Alt/Option + arrow keys to switch panes
bind -n M-H select-pane -L
bind -n M-L select-pane -R
bind -n M-K select-pane -U
bind -n M-J select-pane -D

# shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
# Enable xterm keys for better compatibility with modern terminal emulators
setw -g xterm-keys on

# copy mode improvements
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'

# tmux catppuccin theme
set -g @catppuccin_flavour 'macchiato'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

set -g status on
set -g history-limit 100000
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# split panes with current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
